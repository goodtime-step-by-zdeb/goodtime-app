<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GoodTime V55.22 Upload Test</title>
<style>
:root{--bg:#081222;--card:#101c2f;--green:#34f58b;--red:#ff4f7b;--yellow:#ffd35a;--text:#f5f8ff;--muted:#aebbd0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#13294d,#081222 60%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:18px}.app{max-width:520px;margin:0 auto}.logo{text-align:center;margin:22px 0 18px}.logo h1{font-size:44px;margin:0;font-weight:900}.logo p{color:var(--muted);font-weight:700}.debug{border:2px solid var(--green);border-radius:18px;background:#07111f;padding:14px;margin:14px 0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;line-height:1.45;max-height:42vh;overflow:auto}.btn{width:100%;border:1px solid rgba(255,255,255,.16);border-radius:28px;background:linear-gradient(180deg,#16243a,#08101e);color:white;padding:22px 18px;margin:12px 0;text-align:left;font-size:22px;font-weight:900;box-shadow:0 0 28px rgba(52,245,139,.18)}.btn small{display:block;font-size:15px;color:var(--muted);font-weight:700;margin-top:6px}.green{box-shadow:0 0 32px rgba(52,245,139,.35)}.red{box-shadow:0 0 32px rgba(255,79,123,.35)}.yellow{box-shadow:0 0 32px rgba(255,211,90,.35)}input{display:none}.status{color:var(--muted);text-align:center;font-size:13px;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <div class="logo"><h1>GoodTime</h1><p>Step by Zdeb rent & service</p></div>
  <div id="debug" class="debug"></div>
  <input id="photoInput" type="file" accept="image/*" capture="environment">
  <button class="btn green" onclick="startWork()">▶ Arbeitszeit starten<small>Testmodus V55.22</small></button>
  <button class="btn yellow" onclick="pickPhoto()">✓ Geschafft<small>Foto auswählen oder aufnehmen</small></button>
  <button class="btn red" onclick="finishAndUpload()">■ Feierabend<small>Foto zu Supabase hochladen</small></button>
  <div class="status">Upload-Ziel: goodtime-photos</div>
</div>
<script>
const VERSION = 'GoodTime V55.22 Direct REST Upload';
const SUPABASE_URL = 'https://ipzodobkasmvyltosmsj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LTO22LDasgxYjFxjS6KP1g_lB0q44AB';
const BUCKET = 'goodtime-photos';
  let CURRENT_USER_ID = 1;
let selectedFile = null;
function log(title, data){
  const el=document.getElementById('debug');
  const time=new Date().toLocaleTimeString('de-DE');
  let out='['+time+'] '+title;
  if(data!==undefined){
    if(typeof data==='string') out+='\n'+data;
    else out+='\n'+JSON.stringify(data,null,2);
  }
  el.textContent += (el.textContent?'\n\n':'') + out;
  el.scrollTop=el.scrollHeight;
}
function startWork(){ log('Arbeitszeit gestartet', {version:VERSION}); }
function pickPhoto(){ document.getElementById('photoInput').click(); }
document.getElementById('photoInput').addEventListener('change', e=>{
  selectedFile = e.target.files && e.target.files[0] ? e.target.files[0] : null;
  if(selectedFile){ log('Foto erkannt', {name:selectedFile.name,size:selectedFile.size,type:selectedFile.type,bodyType:selectedFile.constructor ? selectedFile.constructor.name : typeof selectedFile}); }
  else log('Kein Foto ausgewählt');
});
async function finishAndUpload(){
  if(!selectedFile){ log('Feierabend ohne Foto', 'Bitte erst Foto machen/auswählen.'); return; }
  const safeType = selectedFile.type || 'image/jpeg';
  const ext = safeType.includes('png') ? 'png' : 'jpg';
  const objectPath = 'feierabend/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  const uploadUrl = SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + objectPath;
  log('Upload startet', {version:VERSION,url:SUPABASE_URL,bucket:BUCKET,objectPath,size:selectedFile.size,type:safeType});
  try{
    const res = await fetch(uploadUrl, {
      method:'POST',
      headers:{
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': safeType,
        'x-upsert': 'false'
      },
      body:selectedFile
    });
    const text = await res.text();
    log('Upload Antwort', {status:res.status,ok:res.ok,response:text});
    if(!res.ok) throw new Error('HTTP '+res.status+' '+text);
    log('UPLOAD ERFOLGREICH', objectPath);
    await fetch(SUPABASE_URL + "/rest/v1/session_photos", {
  method: "POST",
  headers: {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
    "Prefer": "return=minimal"
  },
  body: JSON.stringify({
    file_path: objectPath,
    photo_typ: "feierabend",
benutzer_id: CURRENT_USER_ID,
projekt: objectPath
  })
});
  }catch(err){
    log('UPLOAD FEHLER', String(err && err.message ? err.message : err));
  }
}
log('App gestartet', {version:VERSION,supabaseUrl:SUPABASE_URL,keyStart:SUPABASE_KEY.slice(0,18)+'...'});
</script>
</body>
</html>
